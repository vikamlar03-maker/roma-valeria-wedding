<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#382016">
  <meta name="description" content="Свадебное приглашение Ромы и Валерии.">
  <title>Рома и Валерия — свадебное приглашение</title>
  <link rel="preload" href="CormorantGaramond-Italic.woff" as="font" type="font/woff" crossorigin>
  <style>
    @font-face {
      font-family: Invitation;
      src: url("CormorantGaramond-Italic.woff") format("woff");
      font-style: italic;
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: GalleryCaption;
      src: url("Kurale-Regular.woff") format("woff");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; }
    :root { color-scheme: light; background: #382016; }
    body { margin: 0; min-height: 100svh; overflow: hidden; background: #382016; }
    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }
    .intro {
      position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
      background: #382016; opacity: 1; filter: blur(0);
      transition: opacity 1400ms ease, filter 1400ms ease, transform 1400ms ease;
    }
    .stage {
      position: relative; width: min(100vw, 56.25svh); aspect-ratio: 9 / 16;
      overflow: hidden; container-type: inline-size;
    }
    .film, .last-frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .last-frame { opacity: 0; pointer-events: none; }
    .stage[data-ready="true"] .last-frame { opacity: 1; }
    .open-invitation {
      /* Coordinates are relative to the complete video frame, not the viewport.
         This is the marked blank area BELOW R | V on the cream paper. */
      position: absolute; z-index: 1; left: 47.5%; top: 57.9%;
      transform: translate(-50%, -46%); width: 58%; min-height: 10%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.6% 2%; gap: .1em; border: 1px solid rgba(76, 44, 27, .5);
      border-radius: 2px; background: rgba(250, 244, 229, .34); color: #2a1913;
      font-family: Invitation, "Palatino Linotype", Georgia, serif;
      font-style: italic; font-weight: 500; font-size: 6cqw; line-height: .95;
      cursor: pointer; opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 800ms ease, background 250ms ease;
    }
    .stage[data-ready="true"] .open-invitation { opacity: 1; visibility: visible; pointer-events: auto; }
    .open-invitation:hover { background: rgba(250, 244, 229, .62); }
    .open-invitation:focus-visible { outline: 2px solid #382016; outline-offset: 4px; }
    .open-invitation:disabled { cursor: wait; }
    .play-video {
      position: absolute; z-index: 1; left: 50%; bottom: 9%; transform: translateX(-50%);
      min-height: 44px; padding: .8em 1.4em; border: 1px solid #eadcc8; border-radius: 2px;
      color: #f6eddf; background: rgba(45, 22, 13, .75); font: 16px Georgia, serif; cursor: pointer;
    }
    .notice {
      position: absolute; z-index: 1; top: 67%; left: 18.5%; width: 58%; margin: 0;
      color: #382016; text-align: center; font: 14px/1.4 Georgia, serif;
    }
    .invitation {
      min-height: 100svh; width: 100%; display: block;
      opacity: 0; filter: blur(18px); transform: scale(1.025);
      transition: opacity 1400ms ease, filter 1400ms ease, transform 1400ms ease;
    }
    .invitation-photo { display: block; width: 100%; height: auto; margin: 0; border: 0; }
    .map-section { position: relative; width: 100%; margin: 0; container-type: inline-size; }
    .map-link {
      /* The existing brown rectangle in Foto3.jpeg: x=137..727, y=415..544. */
      position: absolute; left: 15.86%; top: 27.02%; width: 68.29%; height: 8.40%;
      min-height: 44px; display: flex; align-items: center; justify-content: center;
      border-radius: 5cqw; color: #fff7ec; text-decoration: none;
      font-family: Invitation, Georgia, serif; font-style: italic; font-weight: 500;
      font-size: clamp(16px, 4.5cqw, 64px); line-height: 1; white-space: nowrap;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: background 200ms ease;
    }
    .map-link:hover { background: rgba(255, 247, 236, .08); }
    .map-link:focus-visible { outline: 2px solid #fff7ec; outline-offset: -5px; }
    .rsvp-section { position: relative; width: 100%; margin: 0; container-type: inline-size; }
    .rsvp-panel {
      /* Blank paper only: below the title (ends near y=450), above the fan (starts near y=965). */
      position: absolute; left: 17%; top: 30.5%; width: 66%; height: 30.5%;
      display: grid; place-items: center; color: #523b29;
    }
    .rsvp-form { width: 100%; margin: 0; display: flex; flex-direction: column; gap: 2cqw; }
    .rsvp-field { display: flex; flex-direction: column; gap: .8cqw; }
    .rsvp-field label {
      font-family: Invitation, Georgia, serif; font-style: italic; font-weight: 500;
      font-size: clamp(14px, 4cqw, 40px); line-height: 1.2;
    }
    .rsvp-field input {
      display: block; width: 100%; min-width: 0; height: clamp(44px, 8cqw, 96px);
      margin: 0; padding: .2em .7em; border: 1px solid #baa58e; border-radius: 3px;
      background: #faf8f4; color: #523b29;
      font-family: Invitation, Georgia, serif; font-style: italic; font-weight: 500;
      font-size: clamp(16px, 4cqw, 40px); line-height: 1.2;
    }
    .rsvp-field input::placeholder { color: #9a826e; opacity: 1; }
    .rsvp-field input:focus-visible { outline: 2px solid #826044; outline-offset: 2px; }
    .rsvp-submit {
      width: 100%; height: clamp(44px, 8cqw, 96px); margin: 0; padding: 0 .7em;
      border: 1px solid #725033; border-radius: 999px; color: #fff7ec; background: #725033;
      font-family: Invitation, Georgia, serif; font-style: italic; font-weight: 500;
      font-size: clamp(18px, 4.8cqw, 48px); line-height: 1; cursor: pointer;
      transition: background 200ms ease;
    }
    .rsvp-submit:hover { background: #604229; }
    .rsvp-submit:focus-visible { outline: 2px solid #826044; outline-offset: 3px; }
    .rsvp-submit:disabled { opacity: .65; cursor: wait; }
    .rsvp-thanks {
      margin: 0; color: #725033; text-align: center; outline: none;
      font-family: Invitation, Georgia, serif; font-style: italic; font-weight: 500;
      font-size: clamp(32px, 10cqw, 100px); line-height: 1.2;
    }
    .rsvp-error { margin: 0; color: #7b3024; font: clamp(12px, 2.5cqw, 24px)/1.2 Georgia, serif; }
    /* Polaroid gallery follows the supplied portrait mockup. */
    .gallery-section { position: relative; width: 100%; aspect-ratio: 9 / 16; container-type: inline-size; overflow: hidden; }
    .gallery-background { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .polaroid { position: absolute; left: 10.5%; top: 17%; width: 77%; margin: 0; padding: 1.2cqw; background: #f7f6ef; box-shadow: 0 .4cqw 1.4cqw #24180c33; }
    .gallery-photo { display: block; width: 100%; aspect-ratio: 7 / 8; object-fit: cover; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
    .gallery-caption { height: 26cqw; padding: 2.5cqw 1.2cqw 2cqw; display: flex; flex-direction: column; justify-content: center; gap: .45em; color: #24221e; text-align: center; font: 3.2cqw/1.32 GalleryCaption, Georgia, serif; letter-spacing: .025em; overflow-wrap: break-word; }
    .gallery-verse, .gallery-reference { margin: 0; }
    .gallery-reference { font-style: normal; }
    .gallery-arrow { position: absolute; top: 44%; width: 12.5%; aspect-ratio: 1; min-width: 44px; min-height: 44px; padding: 1.6cqw; border: .45cqw solid #17130f; border-radius: 50%; background: transparent; color: #17130f; cursor: pointer; }
    .gallery-prev { left: .4%; }
    .gallery-next { right: 1.8%; }
    .gallery-arrow svg { width: 100%; height: 100%; display: block; }
    .gallery-arrow:focus-visible { outline: 2px solid #fff7ec; outline-offset: 4px; }
    .gallery-arrow:hover { background: #f7f6ef33; }
    .countdown-section { width: 100%; padding: 4.5cqw 0 28cqw; background: #fff; container-type: inline-size; }
    .countdown-photo-panel { position: relative; isolation: isolate; width: min(100%, 69svh); margin-inline: auto; container-type: inline-size; aspect-ratio: 3 / 4; overflow: hidden; color: #fff9ed; background: #39261c url("Fon.JPG") center / cover; }
    .countdown-photo { position: absolute; z-index: -2; top: 25%; left: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; mask-image: linear-gradient(to bottom, transparent, #000 22%); }
    .countdown-photo-panel::before { content: ""; position: absolute; z-index: -1; inset: 0; background: linear-gradient(180deg, #35231959, transparent 55%, #26160c26); pointer-events: none; }
    .countdown-photo-panel::after { content: ""; position: absolute; inset: 3.1%; border: 1px solid #f5e6cdcf; pointer-events: none; }
    .countdown-heading { position: absolute; inset: 6% 5% auto; margin: 0; text-align: center; font-family: Invitation, Georgia, serif; font-style: italic; font-weight: 500; font-size: 10.4cqw; line-height: 1.15; text-shadow: 0 1px 5px #24160b66; }
    .countdown-clock { position: absolute; top: 20%; left: 8%; width: 84%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.5cqw; text-align: center; }
    .countdown-unit { display: flex; flex-direction: column; align-items: center; min-width: 0; }
    .countdown-dial { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 1; border: 1px solid #f9efdb; border-radius: 50%; background: #e7d5af18; box-shadow: 0 0 0 1px #25180b0d; }
    .countdown-ticks { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: #fff4db; stroke-width: .65; }
    .countdown-ticks .major { stroke-width: 1; }
    .countdown-ticks .hand { stroke: #d8ad68; stroke-width: 1.1; stroke-linecap: round; transform-origin: 50px 50px; }
    .countdown-ticks .hand-dot { stroke: #f4dcac; fill: #a7773e; stroke-width: .8; }
    .countdown-number { position: relative; margin-top: 1.1cqw; font: 5.5cqw/1 GalleryCaption, Georgia, serif; font-variant-numeric: tabular-nums; text-shadow: 0 1px 5px #21110877; }
    .countdown-label { margin-top: 2cqw; font: 3cqw/1.2 GalleryCaption, Georgia, serif; }
    .countdown-dedication { position: absolute; top: 39%; left: 12%; width: 76%; margin: 0; text-align: center; text-shadow: 0 1px 7px #211108aa; }
    .countdown-heart { display: block; margin: 0 auto 1cqw; width: 5.7cqw; height: 5.7cqw; fill: none; stroke: currentColor; stroke-width: 1.2; }
    .countdown-dedication span { display: block; font: 3.8cqw/1.4 GalleryCaption, Georgia, serif; letter-spacing: .17em; }
    .countdown-birds { position: absolute; right: 3.8%; bottom: 3.8%; width: 35%; height: auto; pointer-events: none; filter: drop-shadow(0 1px 1px #29150526); }
    body[data-state="opening"] .intro { opacity: 0; filter: blur(22px); transform: scale(1.035); pointer-events: none; }
    body[data-state="opening"] .invitation, body[data-state="opened"] .invitation {
      opacity: 1; filter: blur(0); transform: scale(1);
    }
    body[data-state="opened"] { overflow: auto; }
    @media (prefers-reduced-motion: reduce) {
      .intro, .invitation { transition-duration: 180ms; }
      .open-invitation { transition-duration: 180ms; }
    }
  </style>
</head>
<body data-state="playing">
  <section class="intro" aria-label="Видео-приглашение">
    <div class="stage" data-ready="false">
      <video class="film" autoplay muted playsinline webkit-playsinline preload="auto" poster="start-poster.jpg" aria-label="Открывающийся свадебный конверт">
        <source src="start.mp4" type="video/mp4">
        <source src="Start.MOV" type="video/quicktime">
      </video>
      <img class="last-frame" src="start-end.jpg" alt="" aria-hidden="true" decoding="async">
      <button class="open-invitation" type="button" aria-label="Открыть пригласительное" disabled>
        <span>Открыть</span><span>пригласительное</span>
      </button>
      <button class="play-video" type="button" hidden>Запустить видео</button>
      <p class="notice" role="alert" hidden></p>
    </div>
  </section>
  <main class="invitation" aria-label="Приглашение Ромы и Валерии" aria-hidden="true" inert>
    <img class="invitation-photo first-photo" src="Foto1.PNG" width="1080" height="1920" alt="Свадебное приглашение Ромы и Валерии: фотографии пары, 31 октября 2026 года." decoding="async" fetchpriority="high" tabindex="-1">
    <img class="invitation-photo second-photo" src="Foto2.PNG" width="1080" height="1920" alt="Дорогие гости! Приглашаем вас на свадьбу 31 октября 2026 года. Место проведения: Weserstraße 170, Bremerhaven 27572." decoding="async" loading="lazy">
    <section class="map-section" aria-label="Место проведения и дресс-код">
      <img class="invitation-photo third-photo" src="Foto3.jpeg" width="864" height="1536" alt="Сервировка свадебного стола. Дресс-код: чёрный, шоколадный, зелёный и кремовый цвета." decoding="async" loading="lazy">
      <a class="map-link" href="https://www.google.com/maps/search/?api=1&amp;query=Weserstra%C3%9Fe%20170%2C%2027572%20Bremerhaven%2C%20Germany" target="_blank" rel="noopener noreferrer">Открыть в Google Maps</a>
    </section>
    <section class="rsvp-section" aria-label="Анкета гостя">
      <img class="invitation-photo fourth-photo" src="Foto4.PNG" width="1080" height="1920" alt="Начало торжества в 11:00. Анкета гостя." decoding="async" loading="lazy">
      <div class="rsvp-panel">
        <form class="rsvp-form" aria-label="Анкета гостя">
          <div class="rsvp-field">
            <label for="guest-name">Ваше имя</label>
            <input id="guest-name" name="name" type="text" autocomplete="name" placeholder="Введите имя" maxlength="120" required>
          </div>
          <div class="rsvp-field">
            <label for="guest-count">Количество человек</label>
            <input id="guest-count" name="guestCount" type="number" inputmode="numeric" min="1" step="1" value="1" aria-describedby="guest-count-hint" required>
            <span id="guest-count-hint" class="sr-only">Общее число человек, включая вас.</span>
          </div>
          <button class="rsvp-submit" type="submit">Отправить</button>
          <p class="rsvp-error" role="alert" hidden></p>
        </form>
        <p class="rsvp-thanks" role="status" tabindex="-1" hidden>Благодарю!</p>
      </div>
    </section>
    <section class="gallery-section" aria-label="Галерея Ромы и Валерии" aria-roledescription="карусель" hidden>
      <img class="gallery-background" src="Fon.JPG" alt="" loading="lazy">
      <figure class="polaroid">
        <img class="gallery-photo" alt="" draggable="false">
        <figcaption class="gallery-caption">
          <p class="gallery-verse"></p>
          <cite class="gallery-reference"></cite>
        </figcaption>
      </figure>
      <button class="gallery-arrow gallery-prev" type="button" aria-label="Предыдущее фото">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M33 20H7m13-13L7 20l13 13"/></svg>
      </button>
      <button class="gallery-arrow gallery-next" type="button" aria-label="Следующее фото">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M7 20h26M20 7l13 13-13 13"/></svg>
      </button>
      <p class="gallery-status sr-only" role="status" aria-live="polite"></p>
    </section>
    <section class="countdown-section" aria-label="До нашего дня осталось" hidden>
      <div class="countdown-photo-panel">
        <img class="countdown-photo" src="timer-photo.jpg" alt="Рома и Валерия смотрят друг на друга в саду." loading="lazy">
        <h2 class="countdown-heading">Увидимся через…</h2>
        <div class="countdown-clock" role="timer" aria-live="off" aria-label="Обратный отсчёт до свадьбы">
          <div class="countdown-unit"><div class="countdown-dial"><svg class="countdown-ticks" viewBox="0 0 100 100" aria-hidden="true" data-dial="days"></svg><span class="countdown-number" data-countdown="days">00</span></div><span class="countdown-label">дней</span></div>
          <div class="countdown-unit"><div class="countdown-dial"><svg class="countdown-ticks" viewBox="0 0 100 100" aria-hidden="true" data-dial="hours"></svg><span class="countdown-number" data-countdown="hours">00</span></div><span class="countdown-label">часов</span></div>
          <div class="countdown-unit"><div class="countdown-dial"><svg class="countdown-ticks" viewBox="0 0 100 100" aria-hidden="true" data-dial="minutes"></svg><span class="countdown-number" data-countdown="minutes">00</span></div><span class="countdown-label">минут</span></div>
          <div class="countdown-unit"><div class="countdown-dial"><svg class="countdown-ticks" viewBox="0 0 100 100" aria-hidden="true" data-dial="seconds"></svg><span class="countdown-number" data-countdown="seconds">00</span></div><span class="countdown-label">секунд</span></div>
        </div>
        <p class="countdown-dedication">
          <svg class="countdown-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S2 14.4 2 7.8C2 1.7 9 .8 12 6c3-5.2 10-4.3 10 1.8C22 14.4 12 21 12 21Z"/></svg>
          <span>ДО НАШЕГО</span><span>СЧАСТЛИВОГО ДНЯ</span>
        </p>
        <img class="countdown-birds" src="golden-swallows.png" alt="" loading="lazy">
      </div>
    </section>
  </main>
  <p id="intro-status" class="sr-only" role="status" aria-live="polite"></p>
  <noscript><style>.intro { display: none; } .invitation { opacity: 1; filter: none; transform: none; }</style></noscript>
  <script>
    (() => {
      const video = document.querySelector('.film');
      const stage = document.querySelector('.stage');
      const intro = document.querySelector('.intro');
      const invitation = document.querySelector('.invitation');
      const photo = document.querySelector('.first-photo');
      const openButton = document.querySelector('.open-invitation');
      const playButton = document.querySelector('.play-video');
      const notice = document.querySelector('.notice');
      const status = document.querySelector('#intro-status');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let opening = false;
      let playAttempt = 0;

      // Original GitHub filenames, including the space in Galeere .JPG.
      // The section stays hidden until all four image files load successfully.
      const gallerySlides = [
        { src: 'Galeere.JPG', verse: '«И дам им одно сердце и один путь…»', reference: 'Иеремия 32:39' },
        { src: 'Galeere .JPG', verse: '«Пленила ты сердце мое, сестра моя, невеста! пленила ты сердце мое одним взглядом очей твоих…»', reference: 'Песнь песней 4:9' },
        { src: 'Galeere1.JPG', verse: '«…нашла того, которого любит душа моя, ухватилась за него, и не отпустила его…»', reference: 'Песнь песней 3:4' },
        { src: 'Galeere2.JPG', verse: '«Так что они уже не двое, но одна плоть. Итак, что Бог сочетал, того человек да не разлучает».', reference: 'Матфея 19:6' }
      ];
      const gallery = document.querySelector('.gallery-section');
      const galleryPhoto = gallery.querySelector('.gallery-photo');
      let galleryIndex = 0;
      function showGalleryPhoto(index) {
        galleryIndex = (index + gallerySlides.length) % gallerySlides.length;
        const slide = gallerySlides[galleryIndex];
        galleryPhoto.src = slide.src;
        galleryPhoto.alt = `Рома и Валерия — фото ${galleryIndex + 1} из 4`;
        gallery.querySelector('.gallery-verse').textContent = slide.verse;
        gallery.querySelector('.gallery-reference').textContent = slide.reference;
        gallery.querySelector('.gallery-status').textContent = `Фото ${galleryIndex + 1} из 4`;
      }
      gallery.querySelector('.gallery-prev').addEventListener('click', () => showGalleryPhoto(galleryIndex - 1));
      gallery.querySelector('.gallery-next').addEventListener('click', () => showGalleryPhoto(galleryIndex + 1));
      gallery.addEventListener('keydown', event => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        showGalleryPhoto(galleryIndex + (event.key === 'ArrowRight' ? 1 : -1));
      });
      let swipeStart = null;
      galleryPhoto.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        swipeStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
        galleryPhoto.setPointerCapture(event.pointerId);
      });
      galleryPhoto.addEventListener('pointercancel', () => { swipeStart = null; });
      galleryPhoto.addEventListener('pointerup', event => {
        if (!swipeStart || swipeStart.id !== event.pointerId) return;
        const dx = event.clientX - swipeStart.x, dy = event.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy) * 1.4) showGalleryPhoto(galleryIndex + (dx < 0 ? 1 : -1));
      });
      Promise.all(gallerySlides.map(slide => new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => image.naturalWidth ? resolve() : reject();
        image.onerror = reject;
        image.src = slide.src;
      }))).then(() => {
        showGalleryPhoto(0);
        gallery.hidden = false;
      }).catch(() => { /* Keep the gallery hidden while original photos are missing or empty. */ });

      // Wedding starts at 11:00 in Bremerhaven; October 31 is CET (UTC+01:00).
      const WEDDING_COUNTDOWN_DATE = "2026-10-31T11:00:00+01:00";
      const countdownSection = document.querySelector('.countdown-section');
      const svgNS = 'http://www.w3.org/2000/svg';
      const countdownHands = {};
      countdownSection.querySelectorAll('[data-dial]').forEach(dial => {
        for (let tick = 0; tick < 60; tick++) {
          const angle = tick * Math.PI / 30;
          const major = tick % 5 === 0;
          const line = document.createElementNS(svgNS, 'line');
          const inner = major ? 39 : 42;
          line.setAttribute('x1', String(50 + Math.sin(angle) * inner));
          line.setAttribute('y1', String(50 - Math.cos(angle) * inner));
          line.setAttribute('x2', String(50 + Math.sin(angle) * 45));
          line.setAttribute('y2', String(50 - Math.cos(angle) * 45));
          if (major) line.setAttribute('class', 'major');
          dial.append(line);
        }
        const hand = document.createElementNS(svgNS, 'g');
        hand.setAttribute('class', 'hand');
        const line = document.createElementNS(svgNS, 'path');
        line.setAttribute('d', 'M50 13V23');
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', '50'); dot.setAttribute('cy', '13'); dot.setAttribute('r', '2');
        dot.setAttribute('class', 'hand-dot');
        hand.append(line, dot); dial.append(hand);
        countdownHands[dial.dataset.dial] = hand;
      });
      if (WEDDING_COUNTDOWN_DATE) {
        const target = Date.parse(WEDDING_COUNTDOWN_DATE);
        if (Number.isFinite(target)) {
          countdownSection.hidden = false;
          const updateCountdown = () => {
            const remaining = Math.max(0, Math.floor((target - Date.now()) / 1000));
            const values = {
              days: Math.floor(remaining / 86400),
              hours: Math.floor(remaining / 3600) % 24,
              minutes: Math.floor(remaining / 60) % 60,
              seconds: remaining % 60
            };
            for (const [unit, value] of Object.entries(values)) {
              countdownSection.querySelector(`[data-countdown="${unit}"]`).textContent = String(value).padStart(2, '0');
              if (countdownHands[unit]) countdownHands[unit].setAttribute('transform', `rotate(${value / (unit === 'hours' ? 24 : unit === 'days' ? 31 : 60) * 360} 50 50)`);
            }
          };
          updateCountdown();
          setInterval(updateCountdown, 1000);
          document.addEventListener('visibilitychange', () => { if (!document.hidden) updateCountdown(); });
        }
      }

      // GOOGLE SHEETS CONNECTION — return here when the table is ready.
      // Paste the published Google Apps Script Web App URL (/exec) below.
      // The script should accept POST JSON in a text/plain body and return { success: true }.
      // Until this is connected, this is a preview: answers stay in this browser only
      // and are NOT delivered to the wedding organizers or a Google spreadsheet.
      const GOOGLE_SHEETS_WEB_APP_URL = '';

      const guestForm = document.querySelector('.rsvp-form');
      const guestName = document.querySelector('#guest-name');
      const guestCount = document.querySelector('#guest-count');
      const sendButton = document.querySelector('.rsvp-submit');
      const formError = document.querySelector('.rsvp-error');
      const formThanks = document.querySelector('.rsvp-thanks');
      guestName.addEventListener('input', () => guestName.setCustomValidity(''));
      guestForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (sendButton.disabled) return;
        guestName.setCustomValidity(guestName.value.trim() ? '' : 'Пожалуйста, укажите ваше имя.');
        if (!guestForm.reportValidity()) return;
        const answer = {
          name: guestName.value.trim(),
          guestCount: Number(guestCount.value),
          submittedAt: new Date().toISOString()
        };
        sendButton.disabled = true;
        guestForm.setAttribute('aria-busy', 'true');
        formError.hidden = true;
        try {
          if (GOOGLE_SHEETS_WEB_APP_URL) {
            const response = await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(answer)
            });
            if (!response.ok) throw new Error('RSVP delivery failed');
            const result = await response.json();
            if (result.success !== true) throw new Error('RSVP not acknowledged');
          } else {
            try { localStorage.setItem('roma-valeria-rsvp-preview', JSON.stringify(answer)); }
            catch { /* The preview also works if the browser blocks local storage. */ }
          }
          guestForm.hidden = true;
          formThanks.hidden = false;
          formThanks.focus({ preventScroll: true });
        } catch {
          formError.textContent = 'Не удалось отправить. Пожалуйста, попробуйте ещё раз.';
          formError.hidden = false;
        } finally {
          guestForm.removeAttribute('aria-busy');
          sendButton.disabled = false;
        }
      });

      function showInvitationButton() {
        if (opening || document.body.dataset.state === 'opened') return;
        video.pause();
        stage.dataset.ready = 'true';
        document.body.dataset.state = 'ready';
        openButton.disabled = false;
        playButton.hidden = true;
        status.textContent = 'Видео завершено. Можно открыть пригласительное.';
      }

      async function startVideo() {
        const attempt = ++playAttempt;
        video.muted = true;
        try {
          await video.play();
          if (attempt === playAttempt) playButton.hidden = true;
        } catch {
          if (stage.dataset.ready !== 'true' && attempt === playAttempt) playButton.hidden = false;
        }
      }

      video.addEventListener('ended', showInvitationButton, { once: true });
      video.addEventListener('error', showInvitationButton, { once: true });
      playButton.addEventListener('click', startVideo);
      // A phone returning from the background must not lose the introduction.
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && document.body.dataset.state === 'playing' && video.paused) startVideo();
      });

      openButton.addEventListener('click', async () => {
        if (opening) return;
        opening = true;
        openButton.disabled = true;
        notice.hidden = true;
        status.textContent = 'Открываем пригласительное.';
        try {
          if (photo.dataset.failed === 'true') photo.src = 'Foto1.PNG?retry=' + Date.now();
          await photo.decode();
          if (!photo.naturalWidth) throw new Error('Photo unavailable');
        } catch {
          photo.dataset.failed = 'true';
          opening = false;
          openButton.disabled = false;
          notice.textContent = 'Фото не загрузилось. Нажмите ещё раз, чтобы повторить.';
          notice.hidden = false;
          return;
        }
        invitation.inert = false;
        invitation.removeAttribute('aria-hidden');
        intro.inert = true;
        intro.setAttribute('aria-hidden', 'true');
        document.body.dataset.state = 'opening';
        let finished = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          intro.hidden = true;
          document.body.dataset.state = 'opened';
          photo.focus({ preventScroll: true });
          status.textContent = 'Пригласительное открыто.';
        };
        intro.addEventListener('transitionend', event => {
          if (event.target === intro && event.propertyName === 'opacity') finish();
        });
        // Also finish if a browser does not emit transitionend in a background tab.
        setTimeout(finish, reducedMotion.matches ? 250 : 1550);
      });

      startVideo();
    })();
  </script>
</body>
</html>
